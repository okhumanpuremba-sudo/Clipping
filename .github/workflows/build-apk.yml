name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Pre-Compiled APK
        run: |
          if [ -f "dist/ClipForgeAI.apk" ]; then
            cp dist/ClipForgeAI.apk ClipForgeAI.apk
            ls -lh ClipForgeAI.apk
          else
            echo "dist/ClipForgeAI.apk not found!"
            exit 1
          fi

      - name: Upload ClipForge AI APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipForgeAI-APK
          path: ClipForgeAI.apk

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: "ClipForge AI Latest Android APK"
          files: ClipForgeAI.apk
          prerelease: false
